<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sale & Offers | My Specs Com</title>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/components/product-card.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/pages/home.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <style>
        .sale-hero {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('/assets/images/hero/image.png');
            background-size: cover;
            background-position: center;
            padding: 100px 0;
            color: white;
            text-align: center;
            border-bottom: 5px solid var(--accent-color);
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }

        .countdown-item {
            background: var(--primary-color);
            padding: 15px 25px;
            border-radius: 4px;
            border: 1px solid var(--accent-color);
            min-width: 100px;
        }

        .countdown-item span {
            display: block;
            font-size: 32px;
            font-weight: 900;
            color: var(--accent-color);
        }

        .countdown-item label {
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 700;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div id="navbar-placeholder"></div>

    <main>
        <section class="sale-hero">
            <div class="container">
                <p class="premium-label" style="color: var(--accent-color);">Limited Time Offer</p>
                <h1 style="font-size: 56px; font-weight: 900;">SEASONAL CLEARANCE</h1>
                <p style="font-size: 24px; margin-top: 20px;">UP TO 60% OFF ELITE COLLECTIONS</p>

                <div class="countdown">
                    <div class="countdown-item">
                        <span id="days">02</span>
                        <label>Days</label>
                    </div>
                    <div class="countdown-item">
                        <span id="hours">14</span>
                        <label>Hours</label>
                    </div>
                    <div class="countdown-item">
                        <span id="minutes">45</span>
                        <label>Mins</label>
                    </div>
                    <div class="countdown-item">
                        <span id="seconds">32</span>
                        <label>Secs</label>
                    </div>
                </div>
            </div>
        </section>

        <div class="container" style="margin: 80px auto;">
            <h2 class="section-title">Exclusive Sale Items</h2>
            <div class="product-grid" id="sale-products-grid">
                <!-- Sale items will be injected here -->
            </div>
        </div>

        <div id="insurance-placeholder"></div>
    </main>

    <div id="footer-placeholder"></div>
    <div id="cart-drawer-placeholder"></div>

    <!-- Custom JS -->
    <script src="../js/cart.js"></script>
    <script src="../js/main.js"></script>
</body>

</html>
