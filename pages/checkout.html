<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout | My Specs Com</title>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/pages/checkout.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div id="navbar-placeholder"></div>

    <main>
        <div class="container">
            <div class="checkout-container">
                <div class="checkout-form-section">
                    <div class="checkout-section-box">
                        <h2>Shipping Information</h2>
                        <form id="shipping-form">
                            <div class="form-row">
                                <div class="form-group">
                                    <label>First Name</label>
                                    <input type="text" required placeholder="John">
                                </div>
                                <div class="form-group">
                                    <label>Last Name</label>
                                    <input type="text" required placeholder="Doe">
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Address</label>
                                <input type="text" required placeholder="123 Street Name">
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>City</label>
                                    <input type="text" required placeholder="New Delhi">
                                </div>
                                <div class="form-group">
                                    <label>Pin Code</label>
                                    <input type="text" required placeholder="110001">
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Phone</label>
                                <input type="tel" required placeholder="+91 99999 99999">
                            </div>
                        </form>
                    </div>

                    <div class="checkout-section-box">
                        <h2>Payment Method</h2>
                        <div class="payment-options">
                            <div class="payment-option active" data-method="card">
                                <i class="fas fa-credit-card"></i>
                                Card
                            </div>
                            <div class="payment-option" data-method="upi">
                                <i class="fas fa-mobile-alt"></i>
                                UPI
                            </div>
                        </div>

                        <div id="card-details" style="margin-top: 25px;">
                            <div class="form-group">
                                <label>Card Number</label>
                                <input type="text" placeholder="XXXX XXXX XXXX XXXX">
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Expiry Date</label>
                                    <input type="text" placeholder="MM/YY">
                                </div>
                                <div class="form-group">
                                    <label>CVV</label>
                                    <input type="password" placeholder="XXX">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="summary-card">
                    <h2>Order Summary</h2>
                    <div id="checkout-items">
                        <!-- Items rendered by JS -->
                    </div>
                    <div class="summary-totals">
                        <div class="summary-row">
                            <span>Subtotal</span>
                            <span id="subtotal">₹0</span>
                        </div>
                        <div class="summary-row">
                            <span>Shipping</span>
                            <span style="color: #27ae60; font-weight: 700;">FREE</span>
                        </div>
                        <div class="summary-row total">
                            <span>Total</span>
                            <span id="final-total">₹0</span>
                        </div>
                    </div>
                    <button class="place-order-btn" id="place-order-btn">PLACE ORDER NOW</button>
                    <p style="text-align: center; font-size: 12px; color: #666; margin-top: 15px;">
                        <i class="fas fa-lock"></i> 256-bit SSL Secure Checkout
                    </p>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <!-- Custom JS -->
    <script src="../js/cart.js"></script>
    <script src="../js/favorites.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script>
        // Checkout Page Specific Logic
        document.addEventListener('DOMContentLoaded', () => {
            if (!window.appAuth || !window.appAuth.isAuthenticated()) {
                window.location.href = '/pages/login-register.html?redirect=' + encodeURIComponent(window.location.pathname);
                return;
            }

            if (!window.appCart) return;

            function renderSummary() {
                const container = document.getElementById('checkout-items');
                const items = window.appCart.items;

                if (items.length === 0) {
                    window.location.href = '/index.html';
                    return;
                }

                container.innerHTML = items.map(item => `
                    <div class="summary-row" style="margin-bottom: 20px; align-items: center;">
                        <img src="${item.image}" style="width: 60px; height: auto; margin-right: 15px; border-radius: 4px;">
                        <div style="flex: 1;">
                            <div style="font-weight: 600; font-size: 14px;">${item.name}</div>
                            <div style="font-size: 12px; color: #666;">Qty: ${item.quantity}</div>
                        </div>
                        <div style="font-weight: 700;">₹${(item.price * item.quantity).toLocaleString()}</div>
                    </div>
                `).join('');

                const total = window.appCart.getTotal();
                document.getElementById('subtotal').textContent = `₹${total.toLocaleString()}`;
                document.getElementById('final-total').textContent = `₹${total.toLocaleString()}`;
            }

            renderSummary();

            // Toggle Payment Method
            document.querySelectorAll('.payment-option').forEach(opt => {
                opt.addEventListener('click', () => {
                    document.querySelectorAll('.payment-option').forEach(o => o.classList.remove('active'));
                    opt.classList.add('active');

                    const method = opt.dataset.method;
                    const cardDetails = document.getElementById('card-details');
                    if (method === 'card') {
                        cardDetails.style.display = 'block';
                    } else {
                        cardDetails.style.display = 'none';
                    }
                });
            });

            // Place Order
            document.getElementById('place-order-btn').addEventListener('click', () => {
                const orderId = 'ORD' + Math.floor(Math.random() * 900000 + 100000);
                const orderData = {
                    orderId: orderId,
                    userId: window.appAuth.user.id,
                    items: [...window.appCart.items],
                    total: window.appCart.getTotal(),
                    date: new Date().toISOString(),
                    status: 'Order Placed'
                };

                // Save to local storage for tracking
                const orders = JSON.parse(localStorage.getItem('orders')) || [];
                orders.push(orderData);
                localStorage.setItem('orders', JSON.stringify(orders));

                // Clear Cart
                localStorage.removeItem('cart');
                window.appCart.items = [];
                window.appCart.notify();

                // Redirect to success/tracking
                alert(`SUCCESS! Your Order #${orderId} has been placed.`);
                window.location.href = `/pages/tracking.html?id=${orderId}`;
            });
        });
    </script>
</body>

</html>
