<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Your Order | My Specs Com</title>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/pages/tracking.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div id="navbar-placeholder"></div>

    <main>
        <div class="container">
            <div class="tracking-container">
                <div class="tracking-search-box">
                    <h1>Track Order</h1>
                    <p>Enter your Order ID to see current status</p>
                    <div class="search-input-group">
                        <input type="text" id="order-id-input" placeholder="e.g. ORD123456">
                        <button id="track-btn">TRACK</button>
                    </div>
                    <p id="error-msg" style="color: var(--primary-color); margin-top: 15px; display: none;">Order ID not
                        found.</p>
                </div>

                <div class="order-status-card" id="order-status-card">
                    <div class="status-header">
                        <div>
                            <h2 id="display-order-id">Order #ORD123456</h2>
                            <p id="display-date" style="color: #666; font-size: 14px;">Placed on April 9, 2026</p>
                        </div>
                        <span class="status-badge" id="display-status">IN TRANSIT</span>
                    </div>

                    <div class="progress-tracker">
                        <div class="progress-step completed" id="step-placed">
                            <div class="step-icon"><i class="fas fa-shopping-bag"></i></div>
                            <div class="step-label">Placed</div>
                        </div>
                        <div class="progress-step active" id="step-processed">
                            <div class="step-icon"><i class="fas fa-cog"></i></div>
                            <div class="step-label">Processed</div>
                        </div>
                        <div class="progress-step" id="step-shipped">
                            <div class="step-icon"><i class="fas fa-truck"></i></div>
                            <div class="step-label">Shipped</div>
                        </div>
                        <div class="progress-step" id="step-delivered">
                            <div class="step-icon"><i class="fas fa-home"></i></div>
                            <div class="step-label">Delivered</div>
                        </div>
                    </div>

                    <div class="order-details-grid">
                        <div class="detail-box">
                            <h4>Estimated Delivery</h4>
                            <p id="est-delivery">April 14, 2026</p>
                        </div>
                        <div class="detail-box">
                            <h4>Shipping Address</h4>
                            <p id="display-address">123 Main St, New Delhi, 110001</p>
                        </div>
                        <div class="detail-box">
                            <h4>Order Total</h4>
                            <p id="display-total">₹0</p>
                        </div>
                        <div class="detail-box">
                            <h4>Items</h4>
                            <p id="display-items">1 Project</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <!-- Custom JS -->
    <script src="../js/cart.js"></script>
    <script src="../js/favorites.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const idFromUrl = urlParams.get('id');
            const input = document.getElementById('order-id-input');
            const btn = document.getElementById('track-btn');
            const card = document.getElementById('order-status-card');
            const error = document.getElementById('error-msg');

            if (idFromUrl) {
                input.value = idFromUrl;
                trackOrder(idFromUrl);
            }

            btn.addEventListener('click', () => {
                trackOrder(input.value.trim());
            });

            function trackOrder(id) {
                const orders = JSON.parse(localStorage.getItem('orders')) || [];
                const order = orders.find(o => o.orderId === id);

                if (order) {
                    error.style.display = 'none';
                    card.style.display = 'block';

                    document.getElementById('display-order-id').textContent = `Order #${order.orderId}`;
                    document.getElementById('display-date').textContent = `Placed on ${new Date(order.date).toLocaleDateString()}`;
                    document.getElementById('display-status').textContent = order.status;
                    document.getElementById('display-total').textContent = `₹${order.total.toLocaleString()}`;
                    document.getElementById('display-items').textContent = `${order.items.length} Product(s)`;

                    // Update progress steps based on status
                    const steps = ['placed', 'processed', 'shipped', 'delivered'];
                    let currentIdx = 0; // "Order Placed" is step 0

                    // Simple mock status logic
                    if (order.status === 'Order Placed') currentIdx = 0;

                    steps.forEach((step, idx) => {
                        const el = document.getElementById(`step-${step}`);
                        el.classList.remove('completed', 'active');
                        if (idx < currentIdx) el.classList.add('completed');
                        if (idx === currentIdx) el.classList.add('active');
                    });

                } else {
                    card.style.display = 'none';
                    error.style.display = 'block';
                }
            }
        });
    </script>
</body>

</html>
